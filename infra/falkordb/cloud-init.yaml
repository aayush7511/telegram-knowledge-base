#cloud-config
# FalkorDB on the free-tier GCE e2-micro (Container-Optimized OS).
# Rendered at create time: __FALKORDB_PASSWORD__ is substituted from
# services/orchestrator/.dev.vars and the rendered file never enters git.
#
# - Data lives on COS's persistent stateful partition (the root FS is
#   read-only), mounted at the image's data dir /var/lib/falkordb/data, so it
#   survives stop/start and reboots.
# - BROWSER=0 disables the bundled web UI (a Node app the 1 GB VM can't spare).
# - systemd restarts the container after a reboot or crash.
# - Append-only persistence + a snapshot every 5 min if anything changed.
# - Image pinned to the digest the M0 spike ran against (graph module 42004).
write_files:
- path: /etc/systemd/system/falkordb.service
  permissions: "0644"
  owner: root
  content: |
    [Unit]
    Description=FalkorDB graph database
    After=docker.service
    Requires=docker.service

    [Service]
    Restart=always
    RestartSec=5
    ExecStartPre=/bin/mkdir -p /mnt/stateful_partition/falkordb
    ExecStartPre=-/usr/bin/docker stop falkordb
    ExecStartPre=-/usr/bin/docker rm falkordb
    ExecStart=/usr/bin/docker run --name falkordb \
      -p 6379:6379 \
      -v /mnt/stateful_partition/falkordb:/var/lib/falkordb/data \
      -e BROWSER=0 \
      -e "REDIS_ARGS=--requirepass __FALKORDB_PASSWORD__ --appendonly yes --save 300 1" \
      falkordb/falkordb@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    ExecStop=/usr/bin/docker stop falkordb

    [Install]
    WantedBy=multi-user.target

runcmd:
- systemctl daemon-reload
- systemctl enable --now falkordb.service
